[package]
name = "op-engine"
description = "WASM-движок OpenPlanner: ядро модели и рендерер в Web Worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glam.workspace = true
image.workspace = true
log.workspace = true
op-export.workspace = true
op-format.workspace = true
op-geom.workspace = true
op-model = { workspace = true, features = ["wasm"] }
op-render.workspace = true
op-scan = { workspace = true, features = ["wasm"] }
serde.workspace = true
tsify.workspace = true
wasm-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["OffscreenCanvas", "console"] }
wgpu = { workspace = true, features = ["webgpu", "webgl"] }

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
zip.workspace = true
