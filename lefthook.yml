# Быстрые проверки перед коммитом; полные — в CI.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,json,css}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: rustfmt
      glob: "*.rs"
      run: cargo fmt --all -- --check

commit-msg:
  jobs:
    - name: conventional-commits
      run: bash scripts/check-commit-msg.sh {1}
