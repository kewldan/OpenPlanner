name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.130
  BUN_VERSION: 1.4.4

jobs:
  rust:
    name: Rust · fmt, clippy, тесты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Системные библиотеки Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Заглушка фронтенда для tauri::generate_context!
        run: mkdir -p apps/desktop/dist && echo '<!doctype html>' > apps/desktop/dist/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo clippy -p op-engine --target wasm32-unknown-unknown -- -D warnings

  web:
    name: Web · Biome, типы, тесты, сборка
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run build:wasm
      - run: bunx tsc -b
      - run: bun test
      - run: bunx vite build
        working-directory: apps/desktop
      - name: Браузер для e2e
        run: bunx playwright install --with-deps chromium
        working-directory: apps/desktop
      - name: E2E (веб-сборка)
        run: bunx playwright test
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/desktop/test-results/
          retention-days: 7

  desktop:
    name: Desktop · ${{ matrix.os }}
    needs: [rust, web]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Системные библиотеки Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version ${{ env.WASM_BINDGEN_VERSION }} --locked
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Сборка приложения без установщика
        run: bunx tauri build --no-bundle
        working-directory: apps/desktop
