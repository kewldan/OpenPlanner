name: CI

# Быстрые проверки на каждый пуш и PR: Rust, веб (с e2e в браузере) и сборка
# приложения под три ОС с самопроверкой запуска. Задачи идут параллельно.
# Тяжёлые нативные проверки (системные диалоги, WebGPU в WebView2, e2e окна
# через tauri-driver, рендер кадра на GPU) — в desktop-checks.yml.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.130
  BUN_VERSION: 1.4.4

jobs:
  rust:
    name: Rust · fmt, clippy, тесты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Системные библиотеки Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            mesa-vulkan-drivers
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Заглушка фронтенда для tauri::generate_context!
        run: mkdir -p apps/desktop/dist && echo '<!doctype html>' > apps/desktop/dist/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p op-engine --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
        env:
          # Рендер без окна обязан пройти (Vulkan на программном lavapipe).
          OPENPLANNER_REQUIRE_GPU: "1"

  web:
    name: Web · Biome, типы, тесты, e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run build:wasm
      - run: bunx tsc -b
      - run: bun test
      - run: bunx vite build
        working-directory: apps/desktop
      - name: Браузер для e2e
        run: bunx playwright install --with-deps chromium
        working-directory: apps/desktop
      - name: E2E (веб-сборка)
        run: bunx playwright test
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/desktop/test-results/
          retention-days: 7

  desktop:
    name: Сборка · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            binary: target/release/openplanner-desktop
            bundle: --bundles app
            artifact: OpenPlanner-macOS.zip
          - os: windows-latest
            binary: target/release/openplanner-desktop.exe
            bundle: --no-bundle
            artifact: target/release/openplanner-desktop.exe
          - os: ubuntu-24.04
            binary: target/release/openplanner-desktop
            bundle: --no-bundle
            artifact: target/release/openplanner-desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Системные библиотеки Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev xvfb
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version ${{ env.WASM_BINDGEN_VERSION }} --locked
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Сборка приложения (на macOS — пакет .app)
        id: build
        run: bunx tauri build ${{ matrix.bundle }}
        working-directory: apps/desktop
      - name: Самопроверка (запуск окна и движка)
        if: runner.os != 'Linux'
        shell: bash
        run: bash scripts/desktop-selftest.sh "${{ matrix.binary }}"
      - name: Самопроверка (запуск окна и движка)
        if: runner.os == 'Linux'
        run: xvfb-run -a bash scripts/desktop-selftest.sh "${{ matrix.binary }}"
      # Сборка для ручной проверки: скачивается со страницы прогона (Artifacts).
      - name: Пакет macOS для скачивания
        if: always() && runner.os == 'macOS' && steps.build.outcome == 'success'
        run: |
          app=target/release/bundle/macos/OpenPlanner.app
          # Подпись без сертификата (ad-hoc): на Apple Silicon приложение без подписи не запускается.
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" OpenPlanner-macOS.zip
      - uses: actions/upload-artifact@v7
        if: always() && steps.build.outcome == 'success'
        with:
          name: OpenPlanner-${{ runner.os }}
          path: ${{ matrix.artifact }}
          retention-days: 14

  web-dist:
    name: Веб-версия
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Пути относительные: сайт можно выложить в любую папку.
      - name: Веб-версия (WASM в релизной сборке)
        run: bun run build:web
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v7
        with:
          name: OpenPlanner-Web
          path: apps/desktop/dist/
          retention-days: 14
