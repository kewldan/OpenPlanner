name: Desktop checks

# Тяжёлые проверки настоящего приложения: системные диалоги и восстановление
# после сбоя, рендер кадра на GPU платформы, WebGPU в WebView2 (Windows),
# e2e окна через tauri-driver (Linux). Запуск вручную и раз в неделю.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: desktop-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.130
  BUN_VERSION: 1.4.4

jobs:
  desktop:
    name: Desktop · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            binary: target/release/openplanner-desktop
          - os: windows-latest
            binary: target/release/openplanner-desktop.exe
          - os: ubuntu-24.04
            binary: target/release/openplanner-desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Системные библиотеки Tauri и окружение для e2e
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            xvfb openbox xdotool imagemagick webkit2gtk-driver
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version ${{ env.WASM_BINDGEN_VERSION }} --locked
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Сборка приложения
        run: bunx tauri build --no-bundle
        working-directory: apps/desktop
      - name: Нативный рендер кадра (wgpu на Metal / D3D12)
        if: runner.os != 'Linux'
        run: cargo test -p op-render -- --nocapture
        env:
          OPENPLANNER_REQUIRE_GPU: "1"
      - name: Системные диалоги и восстановление после сбоя
        if: runner.os != 'Linux'
        shell: bash
        run: bash scripts/desktop-dialogs.sh "${{ matrix.binary }}"
        env:
          SHOTS: ${{ github.workspace }}/apps/desktop/test-results/desktop
      - name: Системные диалоги и восстановление после сбоя
        if: runner.os == 'Linux'
        run: xvfb-run -a bash -c 'openbox & sleep 1; bash scripts/desktop-dialogs.sh "${{ matrix.binary }}"'
        env:
          SHOTS: ${{ github.workspace }}/apps/desktop/test-results/desktop
      # Программный адаптер WebGPU на раннере без GPU нестабилен: шаг не валит прогон.
      - name: Самопроверка на WebGPU (WebView2 + программный адаптер)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        env:
          EXPECT_BACKEND: BrowserWebGpu
        run: |
          variants=(
            "--enable-unsafe-webgpu --ignore-gpu-blocklist"
            "--enable-unsafe-webgpu --ignore-gpu-blocklist --use-webgpu-adapter=swiftshader"
            "--enable-unsafe-webgpu --ignore-gpu-blocklist --enable-features=Vulkan --use-vulkan=swiftshader --use-webgpu-adapter=swiftshader"
          )
          for args in "${variants[@]}"; do
            echo "::group::OPENPLANNER_WEBVIEW2_ARGS=$args"
            if OPENPLANNER_WEBVIEW2_ARGS="$args" bash scripts/desktop-selftest.sh "${{ matrix.binary }}"; then
              echo "::endgroup::"
              echo "WebGPU в настоящем окне WebView2: $args"
              exit 0
            fi
            echo "::endgroup::"
          done
          exit 1
      - name: tauri-driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked
      - name: E2E десктопа (нативные диалоги, файлы, восстановление)
        if: runner.os == 'Linux'
        run: bash scripts/desktop-e2e.sh
        env:
          APP: ${{ github.workspace }}/${{ matrix.binary }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desktop-screenshots-${{ runner.os }}
          path: apps/desktop/test-results/desktop/
          retention-days: 7
