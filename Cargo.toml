[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/kewldan/OpenPlanner"
publish = false

[workspace.dependencies]
op-model = { path = "crates/op-model" }
op-geom = { path = "crates/op-geom" }
op-render = { path = "crates/op-render" }
op-format = { path = "crates/op-format" }
op-scan = { path = "crates/op-scan" }
op-export = { path = "crates/op-export" }
op-calc = { path = "crates/op-calc" }

bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.34", features = ["serde", "bytemuck"] }
log = "0.4"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

console_error_panic_hook = "0.1"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
tsify = { version = "0.5", default-features = false, features = ["js"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
percent-encoding = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Строгие правила (см. docs/decisions.md)
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
float_cmp = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
cast_lossless = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
needless_pass_by_value = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
uninlined_format_args = "warn"
doc_markdown = "warn"

# TS-объявления tsify хранятся в custom section объектного файла. В dev-сборке
# с множеством codegen units линкер может выбросить секцию из крейта, если её
# единица кода больше ничем не используется, и тип пропадёт из .d.ts.
[profile.dev.package.op-model]
codegen-units = 1

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
